const BO="\u2062",BC="\u2063";   // invisible bold markers

function load(){
  let s=null; try{s=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){}
  if(!s||!s.entries){
    const entries={}; for(const n of PEOPLE){entries[n]={am:"",pm:""};}
    s={title:"ตารางงาน",date:ymd(1),entries};
  }
  if(!s.hidden){ // migrate from older version
    s.hidden={}; for(const n of PEOPLE) s.hidden[n]= n in HIDDEN_DEFAULT ? !(s.show&&s.show[n]) : false;
    delete s.show;
  }
  for(const n of PEOPLE){ if(!s.entries[n]) s.entries[n]={am:"",pm:""}; if(!(n in s.hidden)) s.hidden[n]=!!HIDDEN_DEFAULT[n]; }
  for(const n of PEOPLE){ const e=s.entries[n];            // migrate old whole-cell bold flags
    for(const c of ["am","pm"]){ if(e[c+"B"]&&e[c]&&!/\*/.test(e[c])) e[c]="*"+e[c].trim()+"*"; delete e[c+"B"]; } }
  for(const n of PEOPLE){ const e=s.entries[n]; for(const c of ["am","pm"]){ e[c]=String(e[c]||"").replace(/\*([^*]+)\*/g,BO+"$1"+BC); } }   // old *bold* data -> invisible markers
  if(s.dateSetOn!==ymd(0)){ s.date=ymd(1); s.dateSetOn=ymd(0); }   // standard = tomorrow; a manual change lasts for today
  return s;
}

function fmtDate(d){ if(!d) return "____"; try{return new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});}catch(e){return d;} }

/* ---- bold: stored with invisible markers (BO ... BC) around bold text, so no symbols ever show in the field ---- */
const segs=t=>String(t||"").split(/(⁢[^⁢⁣]+⁣)/).filter(x=>x!=="").map(x=>(x[0]===BO&&x.length>=3&&x.endsWith(BC))?{t:x.slice(1,-1),b:1}:{t:x.replace(/[⁢⁣]/g,""),b:0});
const hasB=t=>/⁢[^⁢⁣]+⁣/.test(t||"");
const fmt=t=>segs(t).map(g=>g.b?`<b>${esc(g.t)}</b>`:esc(g.t)).join("");
function renderOv(inp){                  // paints the formatted (partly bold) text behind the transparent input
  const ov=inp.previousElementSibling; if(!ov||!ov.classList.contains("ov")) return;
  ov.firstElementChild.innerHTML=fmt(inp.value);
  ov.classList.toggle("vac",isVac(inp.value));
  ov.firstElementChild.style.transform=`translateX(${-inp.scrollLeft}px)`;
}
function refreshOv(){ $("list").querySelectorAll(".f input").forEach(renderOv); }
$("list").addEventListener("focusout",ev=>{ if(ev.target.dataset&&ev.target.dataset.k) setTimeout(()=>renderOv(ev.target),50); });
function ovLoop(){                       // keep the painted text scrolled like the input while typing long text
  const ov=typeEl&&typeEl.previousElementSibling;
  if(ov&&ov.firstElementChild) ov.firstElementChild.style.transform=`translateX(${-typeEl.scrollLeft}px)`;
  requestAnimationFrame(ovLoop);
}
const mixW=t=>segs(t).reduce((a,g)=>a+textW(g.t,g.b?700:400),0);
function parseB(v){                       // plain text + per-character bold flags + map from string index to plain index
  let text="",flags=[],map=[],bold=false;
  for(let i=0;i<v.length;i++){ const c=v[i]; map.push(text.length); if(c===BO){bold=true;continue;} if(c===BC){bold=false;continue;} text+=c; flags.push(bold?1:0); }
  map.push(text.length); return {text,flags,map};
}
function serB(text,flags){
  let out="",inb=false;
  for(let i=0;i<text.length;i++){ const f=flags[i]; if(f&&!inb){out+=BO;inb=true;} if(!f&&inb){out+=BC;inb=false;} out+=text[i]; }
  return inb?out+BC:out;
}
function toggleBoldValue(v,s,e){          // bold / unbold the selected part
  const p=parseB(v); let a=p.map[s], b=p.map[e];
  if(a===undefined||b===undefined) return v;
  while(a<b&&/\s/.test(p.text[a])) a++;
  while(b>a&&/\s/.test(p.text[b-1])) b--;
  if(a>=b) return v;
  const all=p.flags.slice(a,b).every(f=>f), fl=p.flags.slice();
  for(let i=a;i<b;i++) fl[i]=all?0:1;
  return serB(p.text,fl);
}
function posAfterPlain(v,n){ if(n<=0) return 0; let c=0; for(let i=0;i<v.length;i++){ if(v[i]!==BO&&v[i]!==BC){ c++; if(c===n) return i+1; } } return v.length; }
function cleanEmpty(v,c){
  const f=x=>x.replace(/⁢⁣/g,"").replace(/⁣⁢/g,"");
  const bf=v.slice(0,c); return [f(v), c-(bf.length-f(bf).length)];
}

/* ---- keyboard-style bold: tap B (no selection) = bold typing on, tap again = off. Selection + B = bold/unbold the selection ---- */
let boldMode=false;
function boldTransform(inp){
  const nv=inp.value, pv=inp._pv;
  if(inp._skip){ inp._skip=false; inp._pv=nv; return; }
  if(pv===undefined||nv===pv){ inp._pv=nv; return; }
  const caret=inp.selectionStart, L=nv.length-pv.length;
  let a,b;
  if(L>0 && caret>=L && pv===nv.slice(0,caret-L)+nv.slice(caret)){ a=caret-L; b=nv.length-caret; }   // plain insertion at the caret
  else{
    const mn=Math.min(pv.length,nv.length); a=0; while(a<mn&&pv[a]===nv[a]) a++;
    b=0; while(b<mn-a&&pv[pv.length-1-b]===nv[nv.length-1-b]) b++;
  }
  const before=nv.slice(0,a), ins=nv.slice(a,nv.length-b), after=nv.slice(nv.length-b);
  let out=nv, pos=null;
  if(ins){
    if(!/[⁢⁣]/.test(ins)){
      const inside=before.lastIndexOf(BO)>before.lastIndexOf(BC);
      if(boldMode&&!inside){
        if(before.endsWith(BC)){ out=before.slice(0,-1)+ins+BC+after; pos=before.length-1+ins.length; }   // continue the bold run just before
        else{ out=before+BO+ins+BC+after; pos=before.length+1+ins.length; }
      }else if(!boldMode&&inside&&after.startsWith(BC)){ out=before+BC+ins+after.slice(1); pos=before.length+1+ins.length; } // bold is off: step out of the run
    }
  }else{
    const del=pv.slice(a,pv.length-b);
    if(del&&/^[⁢⁣]+$/.test(del)){            // backspace landed on an invisible marker: delete the visible character before it instead
      let k=a-1; while(k>=0&&(pv[k]===BO||pv[k]===BC)) k--;
      if(k>=0){ out=pv.slice(0,k)+pv.slice(k+1); pos=k; } else { out=pv; pos=a+del.length; }
    }
    const t=cleanEmpty(out,pos===null?inp.selectionStart:pos); out=t[0]; pos=t[1];
  }
  if(out!==nv){ inp.value=out; try{inp.setSelectionRange(pos,pos);}catch(e){} }
  inp._pv=inp.value;
}
function toggleBold(inp){
  const s=inp.selectionStart, e=inp.selectionEnd, v=inp.value;
  const nv=toggleBoldValue(v,s,e); if(nv===v) return;
  const endPlain=parseB(v).map[e];
  inp.value=nv; inp._skip=true;
  try{ const p=posAfterPlain(nv,endPlain); inp.setSelectionRange(p,p); }catch(x){}
  inp.dispatchEvent(new Event("input",{bubbles:true}));
}
let SW=900; // current report width in px
const _mc=document.createElement("canvas").getContext("2d");
function textW(t,weight){ _mc.font=`${weight} 22px ${getComputedStyle(document.body).fontFamily}`; return _mc.measureText(t||"").width; }
function sheetHTML(){
  const vis=visible();
  let nameW=0, colW=0;
  for(const n of vis){ const e=state.entries[n];
    nameW=Math.max(nameW,textW(n,700));
    colW=Math.max(colW,mixW(e.am),mixW(e.pm)); }
  nameW=Math.max(150,Math.ceil(nameW)+30);
  colW=Math.max(330,Math.ceil(colW)+34);           // AM and PM always the same width
  SW=nameW+colW*2+28;
  const cols=`<colgroup><col style="width:${nameW}px"><col style="width:${colW}px"><col style="width:${colW}px"></colgroup>`;
  const rows=visible().map(n=>{const e=state.entries[n];
    return `<tr><th>${esc(n)}</th><td class="${isVac(e.am)?"vac":""}">${fmt(e.am)}</td><td class="${isVac(e.pm)?"vac":""}">${fmt(e.pm)}</td></tr>`;}).join("");
  const head=`<div class="st"><b>Q on ${esc(fmtDate(state.date))}</b></div>`;
  return `<div style="width:${SW-28}px">${head}<table>${cols}<thead><tr><th></th><th>AM</th><th>PM</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---- mini preview: position + size ---- */
const MIN_W=90, MIN_H=70;
function clampMini(){
  const m=state.mini, vw=innerWidth, vh=innerHeight;
  m.w=Math.max(MIN_W,Math.min(m.w,vw-8));
  m.h=Math.max(MIN_H,Math.min(m.h,vh-16));
  m.x=Math.max(4,Math.min(m.x,vw-m.w-4));
  m.y=Math.max(4,Math.min(m.y,vh-m.h-4));
}
function layoutMini(){
  if(!state.mini) return;
  clampMini();
  const m=state.mini, el=$("mini");
  el.style.left=m.x+"px"; el.style.top=m.y+"px"; el.style.width=m.w+"px"; el.style.height=m.h+"px";
  const sh=$("msheet").offsetHeight||1, bodyH=m.h-24;
  const sc=Math.min(m.w/SW, bodyH/sh);
  $("mscale").style.transform=`scale(${sc})`;
  $("mwrap").style.width=(SW*sc)+"px";
  $("mwrap").style.height=(sh*sc)+"px";
}

function track(handle,onMove,onTap){
  handle.addEventListener("pointerdown",ev=>{
    if(ev.target.closest("button")) return;
    ev.preventDefault(); ev.stopPropagation(); handle.setPointerCapture(ev.pointerId);
    const start={px:ev.clientX,py:ev.clientY,...state.mini}; let moved=false;
    const move=e=>{const dx=e.clientX-start.px,dy=e.clientY-start.py; if(Math.abs(dx)+Math.abs(dy)>6) moved=true; onMove(start,dx,dy); layoutMini();};
    const up=e=>{handle.removeEventListener("pointermove",move);handle.removeEventListener("pointerup",up);handle.removeEventListener("pointercancel",up);save(); if(!moved&&onTap&&e.type==="pointerup") onTap();};
    handle.addEventListener("pointermove",move); handle.addEventListener("pointerup",up); handle.addEventListener("pointercancel",up);
  });
}

/* ---- full screen preview with smooth zoom (buttons + pinch) ---- */
let ovS=1, ovH=0;                     // absolute scale, sheet height at scale 1
const ovFit=()=>Math.min(1,($("ovBody").clientWidth||SW)/SW);
function ovApply(ns,cx,cy){
  const b=$("ovBody"), fit=ovFit();
  ns=Math.max(fit*0.5,Math.min(3,ns));
  const px=(b.scrollLeft+cx)/ovS, py=(b.scrollTop+cy)/ovS;      // content point under the anchor
  ovS=ns;
  const w=$("ovw"); w.style.width=(SW*ns)+"px"; w.style.height=(ovH*ns)+"px";
  $("ovs").style.transform=`scale(${ns})`;
  b.scrollLeft=px*ns-cx; b.scrollTop=py*ns-cy;
}
function buildOverlay(keep){
  const fit=ovFit();
  $("ovBody").innerHTML=`<div class="ovw" id="ovw" style="overflow:hidden;margin:0 auto"><div id="ovs" style="width:${SW}px;transform-origin:0 0"><div class="sheet" id="ovsheet">${sheetHTML()}</div></div></div>`;
  ovH=$("ovsheet").offsetHeight;
  const b=$("ovBody"); ovS=keep?ovS:fit; ovApply(ovS,b.clientWidth/2,b.clientHeight/2);
}
function fillOverlay(){ buildOverlay(true); }
function openOverlay(){ document.activeElement&&document.activeElement.blur(); $("overlay").hidden=false; buildOverlay(false); }
$("miniFull").onclick=openOverlay;
$("mini").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openOverlay();}};
const ovCenter=()=>[$("ovBody").clientWidth/2,$("ovBody").clientHeight/2];
$("zIn").onclick=()=>{const[c,d]=ovCenter();ovApply(ovS*1.3,c,d);};
$("zOut").onclick=()=>{const[c,d]=ovCenter();ovApply(ovS/1.3,c,d);};
$("ovClose").onclick=()=>{$("overlay").hidden=true;};
// pinch to zoom
(function(){
  const b=$("ovBody"); let d0=0,s0=1,raf=0;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  b.style.touchAction="pan-x pan-y";
  b.addEventListener("touchstart",e=>{ if(e.touches.length===2){ d0=dist(e.touches); s0=ovS; } },{passive:true});
  b.addEventListener("touchmove",e=>{
    if(e.touches.length!==2||!d0) return; e.preventDefault();
    const r=b.getBoundingClientRect(), t=e.touches;
    const cx=(t[0].clientX+t[1].clientX)/2-r.left, cy=(t[0].clientY+t[1].clientY)/2-r.top, k=dist(t)/d0;
    cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>ovApply(s0*k,cx,cy));
  },{passive:false});
  b.addEventListener("touchend",e=>{ if(e.touches.length<2) d0=0; },{passive:true});
})();

/* ---- Share: image is pre-rendered in the background so the share sheet opens instantly on tap
        (Share sheet -> Outlook attaches it to a new mail, OneDrive saves it) ---- */
let shareFile=null, shareStamp=0, shareT=null;
function scheduleShare(){ shareFile=null; shareStamp++; $("btnShare").style.opacity=".55"; clearTimeout(shareT); shareT=setTimeout(prepShare,700); }
async function prepShare(){
  const stamp=shareStamp;
  try{
    const c=await capture(); const b=await new Promise(r=>c.toBlob(r,"image/png"));
    if(stamp!==shareStamp) return;
    shareFile=new File([b],fname("png"),{type:"image/png"}); $("btnShare").style.opacity="";
  }catch(e){ console.error(e); }
}
const fname=ext=>`Q-${state.date||"roster"}.${ext}`;
let dl=null; (async()=>{try{if(window.claude&&claude.use) dl=await claude.use("downloads");}catch(e){}})();
async function offer(blob,filename){
  if(dl){
    try{await dl.save({filename,data:blob});toast("Saved");}
    catch(e){toast(e&&e.code==="declined"?"Save cancelled":e&&e.code==="rate_limited"?"Wait a moment, then try again":"Saving isn't available in this view");}
    return;
  }
  const ua=navigator.userAgent||"";
  const inApp=/Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(ua);       // in-app browsers (LINE etc.) block downloads
  if(inApp||!("download" in HTMLAnchorElement.prototype)){
    // 1) system share sheet (has "Save Image" / "Save to Files")
    try{
      const f=new File([blob],filename,{type:blob.type});
      if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); return; }
    }catch(e){ if(e&&e.name==="AbortError") return; }
    // 2) fallback: show the image so it can be pressed and held to save
    showSave(filename.endsWith(".pdf"));
    return;
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

}

async function shareFallback(){
  // browsers that can't open the share sheet (e.g. LINE): show the image; press and hold -> "Share…" / "Save to Photos"
  try{
    if(shareFile) lastImg=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(shareFile);});
    else { const c=await capture(); lastImg=c.toDataURL("image/png"); }
    showSave(false,true);
  }catch(e){ console.error(e); toast("Couldn't create the image. Try again."); }
}
$("btnShare").onclick=()=>{
  if(navigator.share && shareFile && navigator.canShare && navigator.canShare({files:[shareFile]})){
    navigator.share({files:[shareFile],title:"Q on"}).catch(e=>{ if(e&&e.name!=="AbortError") shareFallback(); });   // called straight from the tap
    return;
  }
  shareFallback();
};
$("btnPng").onclick=()=>run($("btnPng"),async()=>{const c=await capture();lastImg=c.toDataURL("image/png");const b=await new Promise(r=>c.toBlob(r,"image/png"));await offer(b,fname("png"));});
$("btnPdf").onclick=()=>run($("btnPdf"),async()=>{
  const c=await capture(); lastImg=c.toDataURL("image/png"); const {jsPDF}=window.jspdf;
  const w=c.width/2, h=c.height/2;
  const pdf=new jsPDF({orientation:w>h?"l":"p",unit:"pt",format:[w,h],compress:true});
  pdf.addImage(c.toDataURL("image/png"),"PNG",0,0,w,h);
  await offer(pdf.output("blob"),fname("pdf"));
});

/* ---- typing preview: shows the full text of the field being edited ---- */
let typeEl=null, hideT=null;
function placeBar(){
  // sits right next to the typing bubble (on the side away from the row), not at the keyboard edge
  const bar=$("abar"), tb=$("typing"); if(bar.hidden||tb.hidden||!typeEl) return;
  const t=tb.getBoundingClientRect(), r=typeEl.closest(".r").getBoundingClientRect();
  const h=bar.offsetHeight||42, bubbleAbove=t.bottom<=r.top+2;
  let top=bubbleAbove?t.top-h-6:t.bottom+6;
  if(top<4) top=t.bottom+6;                       // no room above: go below the bubble
  bar.style.transform=`translateY(${Math.round(top)}px)`;
}
function placeTyping(){
  // anchor next to the field being edited, so it is always where you are looking
  const box=$("typing"); if(!typeEl||box.hidden) return;
  const r=typeEl.closest(".r").getBoundingClientRect(), h=box.offsetHeight||60;
  let top=r.top-h-8;
  if(top<6) top=r.bottom+8;                       // no room above: put it just below the row
  box.style.transform=`translateY(${Math.round(top)}px)`;
  placeBar();
}
function showTyping(inp){
  if(typeEl!==inp) boldMode=false;
  typeEl=inp; clearTimeout(hideT); inp._pv=inp.value;
  const row=inp.closest(".r"), n=row.dataset.n, k=inp.dataset.k.toUpperCase();
  $("tl").innerHTML=`<b>${esc(n)}</b> · ${k}`;
  updateTyping(); $("typing").hidden=false; $("abar").hidden=false; placeTyping(); placeBar(); setTimeout(()=>{placeTyping();placeBar();},120); setTimeout(()=>{placeTyping();placeBar();},400);
}
function syncBold(){
  const b=$("boldBtn"); if(!b) return;
  b.classList.toggle("idle",!typeEl);
  b.setAttribute("aria-pressed",!!(typeEl&&boldMode));
  const l=$("ablab"); if(l) l.textContent=boldMode?"Bold on":"Bold off · select text to bold part";
}
function updateTyping(){
  syncBold();
  if(!typeEl) return;
  const v=typeEl.value, t=$("tt");
  t.classList.toggle("empty",!v);
  t.innerHTML=(v?fmt(v):"(empty)")+"<i></i>";
}
// Bold button: acts on the selection / word at the caret in the cell being edited (does not steal focus, so the keyboard stays)
(function(){
  const bb=$("boldBtn");
  bb.addEventListener("pointerdown",ev=>{
    ev.preventDefault();
    if(!typeEl){ toast("Tap a cell first, then B"); return; }
    const sel=typeEl.selectionStart!==typeEl.selectionEnd;
    if(sel){ toggleBold(typeEl); }                       // text selected: bold / unbold just that part
    else{ boldMode=!boldMode; toast(boldMode?"Bold on":"Bold off"); }   // like a keyboard: typing is bold until tapped again
    syncBold();
  });
  bb.addEventListener("mousedown",ev=>ev.preventDefault());
  bb.addEventListener("touchstart",ev=>ev.preventDefault(),{passive:false});
})();
(function(){
  const bar=$("abar");
  bar.addEventListener("mousedown",ev=>ev.preventDefault());
  bar.addEventListener("touchstart",ev=>{ if(!ev.target.closest("#aDone")) ev.preventDefault(); },{passive:false});
  $("aDone").addEventListener("click",()=>{ if(typeEl) typeEl.blur(); });
})();
$("list").addEventListener("focusin",ev=>{ if(ev.target.dataset&&ev.target.dataset.k && !editing) showTyping(ev.target); });
$("list").addEventListener("input",ev=>{ if(ev.target===typeEl){ updateTyping(); placeTyping(); } });
$("list").addEventListener("focusout",()=>{ hideT=setTimeout(()=>{ if(!document.activeElement||!document.activeElement.dataset||!document.activeElement.dataset.k){ typeEl=null; boldMode=false; $("typing").hidden=true; $("abar").hidden=true; syncBold(); } },150); });
if(window.visualViewport){ visualViewport.addEventListener("resize",()=>{placeTyping();placeBar();}); visualViewport.addEventListener("scroll",()=>{placeTyping();placeBar();}); }
addEventListener("scroll",()=>{placeTyping();placeBar();},{passive:true,capture:true});

buildList(); renderPreview(); setMini(state.mini.open); ovLoop();
/* ---- V02.1 intro: a swarm of bats flies out of the screen toward you ---- */
function batBurst(){
  const el=$("intro"); if(!el) return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const W=innerWidth,H=innerHeight,N=20,r=(a,b)=>a+Math.random()*(b-a);
  el.innerHTML=""; el.style.animation="none"; void el.offsetWidth; el.style.animation="";
  for(let i=0;i<N;i++){
    const a=(i/N)*Math.PI*2+r(-.2,.2), close=i%5===0;          // every 5th bat comes almost straight at you
    const b=document.createElement("div"); b.className="ib"; b.innerHTML=BAT_SVG;
    const dx=Math.cos(a)*W*(close?r(.05,.25):r(.55,1.05)), dy=Math.sin(a)*H*(close?r(.05,.2):r(.45,.9));
    const rot=r(-28,28);
    b.style.setProperty("--dx",dx.toFixed(0)+"px"); b.style.setProperty("--dy",dy.toFixed(0)+"px");
    b.style.setProperty("--s",(close?r(8,11):r(2.6,6.5)).toFixed(2));
    b.style.setProperty("--r",rot.toFixed(0)+"deg"); b.style.setProperty("--r2",(rot+r(-30,30)+(dx>0?14:-14)).toFixed(0)+"deg");
    b.style.setProperty("--t",r(1.7,2.7).toFixed(2)+"s"); b.style.setProperty("--d",r(0,1.0).toFixed(2)+"s");
    el.appendChild(b);
  }
  clearTimeout(batBurst.t); batBurst.t=setTimeout(()=>{el.innerHTML="";},4800);
}
const BAT_SVG='<svg viewBox="0 0 100 50" aria-hidden="true"><g class="wl"><path d="M45 17Q31 4 3 9Q11 17 9 28Q17 22 23 31Q27 25 33 35Q39 29 45 31Z"/></g><g class="wr"><path d="M55 17Q69 4 97 9Q89 17 91 28Q83 22 77 31Q73 25 67 35Q61 29 55 31Z"/></g><path d="M50 13L53.5 6L56 15Q58.5 21 56 29Q54 37 50 41Q46 37 44 29Q41.5 21 44 15L46.5 6Z"/></svg>';
const _h1=document.querySelector(".top h1"); if(_h1) _h1.addEventListener("click",batBurst);
setTimeout(batBurst,250);
